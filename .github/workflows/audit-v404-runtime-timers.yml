name: Audit V40.4 runtime timers

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan recurring runtime work
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('index.html'), *sorted(Path('.').glob('*.js'))]
          patterns = {
              'setInterval': re.compile(r'\bsetInterval\s*\('),
              'MutationObserver': re.compile(r'\bMutationObserver\s*\('),
              'requestAnimationFrame': re.compile(r'\brequestAnimationFrame\s*\('),
          }
          lines = []
          for path in roots:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for number, line in enumerate(text.splitlines(), 1):
                  for label, pattern in patterns.items():
                      if pattern.search(line):
                          snippet = ' '.join(line.strip().split())
                          lines.append(f'{label}\t{path}\t{number}\t{snippet[:420]}')
          Path('runtime-timer-audit.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-timer-audit
          path: runtime-timer-audit.txt
