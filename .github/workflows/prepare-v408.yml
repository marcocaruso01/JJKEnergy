name: Prepare V40.8 Game State

on:
  push:
    branches: [agent/v408-game-state-legacy-bridge]

permissions:
  contents: write

concurrency:
  group: prepare-v408-game-state
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate V40.8 integration
        run: |
          python3 scripts/prepare-v408.py
          echo generated > v408-prep-stage.txt
      - name: Validate syntax and static integrity
        run: |
          node --check legacy-bridge-v408.js
          node --check game-state-v408.js
          node --check character-catalog-v407.js
          node --check scripts/static-audit.mjs
          npm install
          npm run audit:static
          echo static-green > v408-prep-stage.txt
      - name: Save prepared integration to branch
        run: |
          rm -f v408-prep-failure.txt v408-prep-stage.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sfx.js package.json scripts/static-audit.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V40.8: activate Game State and Legacy Bridge"
          git push
      - name: Run complete browser suite
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Save pre-integration failure diagnostic
        if: failure()
        run: |
          stage=$(cat v408-prep-stage.txt 2>/dev/null || echo before-browser)
          printf 'V40.8 preparation failed before normal PR validation\nrun_id=%s\nhead=%s\nlast_completed_stage=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$stage" > v408-prep-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/v408-game-state-legacy-bridge || true
          git add v408-prep-failure.txt
          git commit -m "V40.8: record preparation failure" || true
          git push || true
