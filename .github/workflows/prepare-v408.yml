name: Prepare V40.8 Game State

on:
  push:
    branches: [agent/v408-game-state-legacy-bridge]

permissions:
  contents: read

concurrency:
  group: prepare-v408-game-state
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V40.8 integration is already prepared
        run: |
          python3 scripts/prepare-v408.py
          git diff --exit-code -- index.html sfx.js package.json .github/workflows/v39-tests.yml scripts/static-audit.mjs
      - name: Validate syntax and static integrity
        run: |
          node --check legacy-bridge-v408.js
          node --check game-state-v408.js
          node --check character-catalog-v407.js
          node --check scripts/static-audit.mjs
          npm install
          npm run audit:static
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run complete browser suite
        run: npm run test:e2e
