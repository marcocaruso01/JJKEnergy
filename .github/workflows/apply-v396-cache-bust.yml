name: Apply V39.8 cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v396-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update site asset version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          updated = re.sub(
              r'sfx\.js\?v=[^"\']+',
              'sfx.js?v=20260728s398a',
              text,
              count=1,
          )
          if updated == text:
              raise SystemExit('sfx.js reference not found or already current')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit cache update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bust cache for V39.8 Itadori rules"
          git push
