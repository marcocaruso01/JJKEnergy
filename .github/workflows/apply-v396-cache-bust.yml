name: Deploy V40.4 event-driven runtime safely
# Protected retry 2026-08-01: run regardless of whether the merge is attributed to a user, bot, or GitHub App.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v396-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v404-event-runtime-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the event-driven version in the worktree
        run: |
          python3 scripts/fix-v404-test-generator.py
          python3 scripts/deploy-v404.py

      - name: Validate syntax and static integrity
        run: |
          node --check v404-event-runtime.js
          node --check scripts/static-audit.mjs
          npm install
          npm run audit:static

      - name: Run the complete browser suite
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v404-deployment-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish only after every check passes
        if: success()
        run: |
          rm -f v404-deploy-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v404-event-runtime.js package.json scripts/deploy-v404.py scripts/static-audit.mjs tests/v404-event-runtime.spec.mjs .github/workflows/v39-tests.yml
          git add -u v404-deploy-failure.txt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V40.4: switch UI refreshes to event-driven updates"
          git push

      - name: Record a safe deployment failure without activating V40.4
        if: failure()
        run: |
          printf 'V40.4 deployment failed in GitHub Actions run %s at %s. The live index was not changed.\n' "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > v404-deploy-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v404-deploy-failure.txt
          git commit -m "Record failed V40.4 protected deployment" || exit 0
          git push
