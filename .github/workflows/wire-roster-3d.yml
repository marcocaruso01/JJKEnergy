name: Wire 3D roster assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert direct 3D asset tags
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="roster-3d.css?v=20260723r3d4">'
          js = '<script src="roster-3d.js?v=20260723r3d4" defer></script>'

          if js not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Missing </body> in index.html')
              text = text.replace(marker, css + '\n' + js + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit direct loader
        run: |
          if git diff --quiet -- index.html; then
            echo "3D loader already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire 3D roster directly in index"
          git push
