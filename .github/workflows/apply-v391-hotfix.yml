name: Apply V39.3 stability hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v391-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Activate V39.3 and invalidate browser cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html, count = re.subn(r'sfx\.js\?v=[^"\']+', 'sfx.js?v=20260726s393a', html)
          if count == 0:
              raise SystemExit('sfx.js reference not found in index.html')
          index.write_text(html, encoding='utf-8')
          PY
          node --check v392-gameplay.js
          node --check v393-stability.js
          node --check sfx.js
          grep -q "v393-stability.js?v=20260726v393a" sfx.js
          grep -q "sfx.js?v=20260726s393a" index.html
      - name: Commit generated cache update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(v39.3): activate stable resource UI and exact technique mapping"
          git push origin main
