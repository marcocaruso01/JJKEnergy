name: Generate V40.6 deep event refactor

on:
  push:
    branches: [agent/v406-deep-event-refactor]
    paths:
      - 'scripts/refactor-v406.py'
      - '.github/workflows/generate-v406-deep-event-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v406-deep-event-refactor
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v406-deep-event-refactor
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate V40.6 deep source refactor
        run: python3 scripts/refactor-v406.py

      - name: Validate modified JavaScript syntax
        run: |
          node --check v406-event-runtime.js
          node --check v37-update.js
          node --check v36-update.js
          node --check v362-rules-hotfix.js
          node --check v392-gameplay.js
          node --check v394-technique-fix.js
          node --check v398-itadori-variable-rules.js
          node --check gameplay-v25.js
          node --check events-v26.js
          node --check events-v26-2.js
          node --check v14-cinematic.js
          node --check gm-ai.js
          node --check sfx.js
          node --check scripts/static-audit.mjs

      - name: Install test dependencies
        run: npm install

      - name: Run static integrity audit
        run: npm run audit:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete desktop and mobile browser suite
        run: npm run test:e2e

      - name: Commit the exact tested V40.6 files
        if: success() && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html package.json scripts/static-audit.mjs sfx.js gm-ai.js v14-cinematic.js gameplay-v25.js events-v26.js events-v26-2.js v36-update.js v37-update.js v362-rules-hotfix.js v392-gameplay.js v394-technique-fix.js v398-itadori-variable-rules.js v406-event-runtime.js tests/v405-event-runtime.spec.mjs tests/v406-source-refactor.spec.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V40.6: remove remaining loaded UI polling at source"
          git push origin HEAD:agent/v406-deep-event-refactor

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v406-deep-refactor-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
