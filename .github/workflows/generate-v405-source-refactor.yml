name: Generate V40.5 source event refactor

on:
  push:
    branches: [agent/v405-source-event-refactor]
    paths:
      - 'scripts/refactor-v405.py'
      - '.github/workflows/generate-v405-source-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v405-source-event-refactor
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v405-source-event-refactor
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate V40.5 source refactor
        run: python3 scripts/refactor-v405.py

      - name: Validate JavaScript syntax
        run: |
          node --check v405-event-runtime.js
          node --check v403-performance-android.js
          node --check v399-itadori-ui-progression.js
          node --check v400-counter-domain-fixes.js
          node --check v401-jogo-counter-stability.js
          node --check v396-jogo-ui-cleanup.js
          node --check v397-runtime-guards.js
          node --check supabase-multiplayer.js
          node --check scripts/static-audit.mjs

      - name: Install test dependencies
        run: npm install

      - name: Run static audit
        run: npm run audit:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete browser suite
        run: npm run test:e2e

      - name: Commit exact tested version
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sfx.js package.json v405-event-runtime.js v403-performance-android.js v399-itadori-ui-progression.js v400-counter-domain-fixes.js v401-jogo-counter-stability.js v396-jogo-ui-cleanup.js v397-runtime-guards.js supabase-multiplayer.js scripts/static-audit.mjs tests/v405-event-runtime.spec.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V40.5: remove recurring legacy UI polls at source"
          git push origin HEAD:agent/v405-source-event-refactor

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v405-source-refactor-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
